<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    {%- for js in js_files %}
      {{ js_tag(js) }}
    {%- endfor %}
    {%- for css in css_files %}
      {{ css_tag(css) }}
    {%- endfor %}
  </head>
  <body>
    <main>
      {% block body %}{{ body }}{% endblock %}
    </main>
  </body>
</html>
